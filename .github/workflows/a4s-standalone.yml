name: Standalone A4S
on:
  push:
  pull_request:
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: sources/a4s/**/pom.xml
      - run: mvn -B -ntp -f sources/a4s/pom.xml verify
      - run: python3 -m unittest discover -s scripts/a4s -p 'test_*.py'
      - name: Verify the core bytecode is local and platform independent
        run: |
          core=sources/a4s/a4s-core/target/a4s-core-0.1.0.jar
          api=sources/a4s/a4s-api/target/a4s-api-0.1.0.jar
          jdeps --class-path "$api" -verbose:class "$core" > "${RUNNER_TEMP}/a4s-dependencies.txt"
          if rg -- '-> (java\.net\.|javax\.net\.|java\.nio\.channels\.|org\.apache\.flink\.|org\.rocksdb\.|io\.kubernetes\.|io\.fabric8\.)' "${RUNNER_TEMP}/a4s-dependencies.txt"; then
            exit 1
          fi
      - name: Run the packaged service without Flink
        run: |
          java -jar sources/a4s/a4s-runner/target/a4s-runner.jar > "${RUNNER_TEMP}/runner.log" &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          curl --fail -H 'Content-Type: application/json' --data-binary @sources/a4s/examples/evaluate.json \
            http://localhost:8080/v1/evaluate | jq -e '.action == "RESCALE" and .operators.join.target.parallelism == 6'
      - name: Test SHARDS without RocksDB
        run: |
          cmake -S sources/libs/frocksdb/util/shards -B "${RUNNER_TEMP}/shards"
          cmake --build "${RUNNER_TEMP}/shards"
          ctest --test-dir "${RUNNER_TEMP}/shards" --output-on-failure
      - name: Build and smoke-test the runner image
        run: |
          docker build -t a4s-runner:ci sources/a4s
          container=$(docker run --rm -d -p 127.0.0.1::8080 a4s-runner:ci)
          trap 'docker logs "$container"; docker stop "$container" >/dev/null' EXIT
          endpoint=$(docker port "$container" 8080/tcp)
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 "http://$endpoint/health"
          curl --fail -H 'Content-Type: application/json' --data-binary @sources/a4s/examples/evaluate.json \
            "http://$endpoint/v1/evaluate" | jq -e '.action == "RESCALE"'
