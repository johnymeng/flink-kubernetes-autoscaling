apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink
spec:
  image: __FLINK_BENCHMARK_IMAGE__
  flinkVersion: v1_18
  serviceAccount: flink
  flinkConfiguration:
    jobmanager.scheduler: adaptive
    job.autoscaler.enabled: 'true'
    job.autoscaler.scaling.enabled: 'true'
    job.autoscaler.justin.enabled: '__JUSTIN_ENABLED__'
    job.autoscaler.a4s.enabled: '__A4S_ENABLED__'
    job.autoscaler.metrics.window: 20s
    job.autoscaler.stabilization.interval: 15s
    job.autoscaler.target.utilization: '0.70'
    job.autoscaler.target.utilization.boundary: '0.15'
    job.autoscaler.catch-up.duration: 1m
    job.autoscaler.restart.time: 10s
    job.autoscaler.vertex.max-parallelism: '2'
    job.autoscaler.vertex.exclude.ids: cbc357ccb763df2852fee8c4fc7d55f2;6cdc5bb954874d922eaee11a8e7b5dd5
    job.autoscaler.quota.cpu: '12'
    job.autoscaler.quota.memory: 9g
    job.autoscaler.checkpoint-rescale.enabled: 'false'
    job.autoscaler.checkpoint-rescale.producer-pause.enabled: 'false'
    kubernetes.operator.job.upgrade.inplace-scaling.enabled: 'true'
    taskmanager.numberOfTaskSlots: '4'
    taskmanager.cpu.cores: '4'
    taskmanager.memory.managed.size: 632m
    slotmanager.number-of-slots.max: '12'
    pipeline.max-parallelism: '128'
    metrics.fetcher.update-interval: '2000'
    execution.checkpointing.interval: __CHECKPOINT_INTERVAL__
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: 60s
    state.backend: rocksdb
    state.backend.incremental: 'true'
    state.backend.rocksdb.memory.managed: 'true'
    state.backend.rocksdb.metrics.block-cache-hit: 'true'
    state.backend.rocksdb.metrics.block-cache-miss: 'true'
    state.backend.rocksdb.metrics.column-family-as-variable: 'true'
    state.backend.latency-track.keyed-state-enabled: 'true'
    state.backend.rocksdb.metrics.stack-distance-histogram: '__A4S_ENABLED__'
    state.checkpoints.dir: file:///mnt/experiments/autoscaling-experiments/flink-state/runs/__RUN_ID__/checkpoints
    state.savepoints.dir: file:///mnt/experiments/autoscaling-experiments/flink-state/runs/__RUN_ID__/savepoints
    high-availability.type: kubernetes
    high-availability.storageDir: file:///mnt/experiments/autoscaling-experiments/flink-state/runs/__RUN_ID__/ha
  jobManager:
    resource: {cpu: 1, memory: 1536m}
  taskManager:
    resource: {cpu: 4, memory: 3072m}
  podTemplate:
    spec:
      containers:
      - name: flink-main-container
        volumeMounts:
        - {name: checkpoints, mountPath: /mnt/experiments/autoscaling-experiments/flink-state}
      volumes:
      - name: checkpoints
        hostPath: {path: /mnt/experiments/autoscaling-experiments/flink-state, type: Directory}
  job:
    jarURI: local:///opt/flink/lib/nexmark-flink-0.3-SNAPSHOT.jar
    entryClass: com.github.nexmark.flink.sql.SqlQueryJob
    parallelism: 1
    upgradeMode: last-state
    args:
    - --query
    - q8_unique
    - --job-name
    - q8_unique-continuous-__POLICY__-__RUN_ID__
    - --source
    - kafka
    - --bootstrap-servers
    - __KAFKA_BOOTSTRAP__
