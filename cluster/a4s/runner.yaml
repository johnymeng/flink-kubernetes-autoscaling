apiVersion: apps/v1
kind: Deployment
metadata:
  name: a4s-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a4s-runner
  template:
    metadata:
      labels:
        app: a4s-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: a4s
          image: a4s-runner:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx192m"
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: a4s-runner
spec:
  selector:
    app: a4s-runner
  ports:
    - port: 8080
      targetPort: http
